<svg width="800" height="960" viewBox="0 0 800 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft background glow -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>

    <!-- Clip path to round the photo edges exactly like the UI mockup -->
    <clipPath id="hero-card-clip">
      <rect x="20" y="20" width="760" height="920" rx="72" />
    </clipPath>

    <!-- Shadow filter for depth -->
    <filter id="card-shadow" x="0" y="0" width="800" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#7C3AED" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background base rounded card with shadow -->
  <rect x="20" y="20" width="760" height="920" rx="72" fill="url(#bg-grad)" filter="url(#card-shadow)" />

  <!-- Embedded Student Photo from the UI Mockup -->
  <g clip-path="url(#hero-card-clip)">
    <image 
      href="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1200&amp;auto=format&amp;fit=crop" 
      x="20" 
      y="20" 
      width="760" 
      height="920" 
      preserveAspectRatio="xMidYMid slice" 
    />
  </g>

  <!-- Card Border -->
  <rect x="20" y="20" width="760" height="920" rx="72" stroke="#FFFFFF" stroke-width="12" />
</svg>
